resources:
  jobs:
    Orders_landing_to_silver:
      name: Orders landing to silver
      tasks:
        - task_key: orders_landing_to_bronze
          notebook_task:
            notebook_path: ../notebooks/landing_to_bronze.py
            base_parameters:
              file_name: orders
              bronze_table_name: orders_stg
        - task_key: orders_bronze_to_silver
          depends_on:
            - task_key: orders_landing_to_bronze
          notebook_task:
            notebook_path: ../notebooks/orders_bronze_to_silver.py
      queue:
        enabled: true
      performance_target: PERFORMANCE_OPTIMIZED

resources:
  jobs:
    Customer_landing_to_silver_table:
      name: Customer landing to silver table
      tasks:
        - task_key: customers_landing_to_bronze
          notebook_task:
            notebook_path: ../notebooks/landing_to_bronze.py
            base_parameters:
              file_name: customers
              bronze_table_name: customers_stg
        - task_key: customers_bronze_to_silver
          depends_on:
            - task_key: customers_landing_to_bronze
          notebook_task:
            notebook_path: ../notebooks/customers_bronze_to_silver.py
      queue:
        enabled: true
      performance_target: PERFORMANCE_OPTIMIZED
